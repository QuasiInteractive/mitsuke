# Local development dependencies:  docker compose up -d
services:
  postgres:
    # Same major version Supabase runs, so local behaviour matches the deployed database.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mitsuke
      POSTGRES_USER: mitsuke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # localhost only, never exposed on the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitsuke -d mitsuke"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    # Local emulator for Azure Storage (queues for the Functions pipeline, blobs later).
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000" # blob
      - "127.0.0.1:10001:10001" # queue
      - "127.0.0.1:10002:10002" # table
    volumes:
      - azuritedata:/data

volumes:
  pgdata:
  azuritedata:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore Mitsuke.slnx

      # Warnings are errors (Directory.Build.props), so this also enforces the analyzers.
      - name: Build
        run: dotnet build Mitsuke.slnx --configuration Release --no-restore

      # Includes the Postgres integration tests: Testcontainers uses the runner's Docker.
      # No secrets needed: tests never call the live TheCarApi.
      - name: Test
        run: >
          dotnet test Mitsuke.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
